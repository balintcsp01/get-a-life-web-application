services:

  db:
    image: postgres:18
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: no
    ports:
      - "8080:8080"
    env_file:
      - .env.example
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: no
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: